name: 发布 npm 包

# 触发方式：
#   1. main 分支收到新提交（通常是 PR 合并）——自动判断是否需要发版：
#      · 本次推送手动改过 package.json 的 version：按该版本发布（minor / major 发版）；
#      · 否则自动升 patch（跳过 npm 上已占用的版本），发布成功后把版本号回写到 main；
#      · 只改文档 / 测试 / CI，或提交信息含 [skip release] 时跳过，避免刷无意义的版本号。
#      发布时会按依赖顺序发布 @router-agent/* SDK、内置 runtime/channel 插件，最后发布根包。
#   2. 推送形如 v0.1.1 的 tag（tag 必须与 package.json 的 version 一致），兼容原有发版方式。
#   3. 在 Actions 页面手动 Run workflow（发布当前分支 package.json 里的版本）。
#
# 说明：GitHub 上的 PR 合并不会触发本地 git hooks，所以「main 合并自动升版」落在
# push(main) 的 GitHub Actions 上；判断规则抽在 scripts/release-plan.mjs，有单测覆盖。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance（构建来源证明）需要通过 OIDC 换取签名令牌
  id-token: write

# 固定并发组，让所有发布串行执行：
# 同一次发版可能同时触发 main 推送和 tag 推送，串行后后者会看到版本已存在并跳过，避免并发 E409。
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    name: 生成发布计划
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      release_version: ${{ steps.plan.outputs.release_version }}
      auto_bump: ${{ steps.plan.outputs.auto_bump }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要拿到推送前的提交，才能判断本次是否改了版本号、改了哪些文件
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${TAG_NAME} 与 package.json 版本 ${pkg_version} 不一致，请先执行 pnpm version 再推 tag。"
            exit 1
          fi

      - name: 生成发布计划
        id: plan
        env:
          PLAN_EVENT_NAME: ${{ github.event_name }}
          PLAN_REF: ${{ github.ref }}
          PLAN_SHA: ${{ github.sha }}
          PLAN_BEFORE: ${{ github.event.before }}
          PLAN_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ "$PLAN_REF" == refs/tags/* ]]; then
            export PLAN_EVENT=tag
          else
            export PLAN_EVENT="$PLAN_EVENT_NAME"
          fi

          changed_file="${RUNNER_TEMP}/release-changed-files.txt"
          message_file="${RUNNER_TEMP}/release-head-message.txt"
          : > "$changed_file"
          : > "$message_file"
          export PLAN_CHANGED_FILES_FILE="$changed_file"
          export PLAN_HEAD_MESSAGE_FILE="$message_file"

          if [[ "$PLAN_EVENT" == "push" ]]; then
            git log -1 --format=%B "$PLAN_SHA" > "$message_file"

            if [[ -n "${PLAN_BEFORE:-}" && ! "$PLAN_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${PLAN_BEFORE}^{commit}" 2>/dev/null; then
              before_pkg="${RUNNER_TEMP}/release-before-package.json"
              if git show "${PLAN_BEFORE}:package.json" > "$before_pkg" 2>/dev/null; then
                PLAN_BEFORE_VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version)" "$before_pkg")"
                export PLAN_BEFORE_VERSION
              fi
              if ! git diff --name-only "$PLAN_BEFORE" "$PLAN_SHA" > "$changed_file" 2>/dev/null; then
                # 比较失败时保守处理：当成有产物改动，避免漏发版
                echo 'package.json' > "$changed_file"
              fi
            fi
          fi

          node scripts/release-plan.mjs

  publish:
    name: 构建并发布
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # 自动升版后需要把版本号提交回 main
      contents: write
      id-token: write
    steps:
      - name: 校验 NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::仓库缺少 NPM_TOKEN secret，请先在 Settings → Secrets and variables → Actions 中配置（见 docs/PUBLISHING.md）。"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        # 版本取自 package.json 的 packageManager 字段
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 应用自动升级后的版本号
        if: needs.check.outputs.auto_bump == 'true'
        env:
          VERSION: ${{ needs.check.outputs.release_version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node scripts/publish-packages.mjs --sync
          echo "package.json 版本已改为 ${VERSION}"

      # 手动改版本号的 PR 不会走 auto_bump，这里也要把所有包同步到根版本。
      - name: 同步所有包的版本号
        if: needs.check.outputs.auto_bump != 'true'
        run: node scripts/publish-packages.mjs --sync

      # E404 通常不是包不存在，而是 token 用户没有根包发布权限。必须在发布
      # 任何插件之前失败，避免出现「插件已发、根包没发」的半发布状态。
      - name: 校验 NPM_TOKEN 的发布权限
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-packages.mjs --check-publisher

      - name: 类型检查与测试
        run: pnpm check

      - name: 构建
        run: pnpm build

      # 先发 SDK 与插件，最后发根包；任一包已存在于同版本时视为失败并中止。
      # 根包 NPM_TOKEN 还必须能发布 @router-agent/* 作用域（首次发布尤甚）。
      - name: 检查待发布版本是否已被占用
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-packages.mjs --check-versions

      # SDK 与内置插件必须按依赖顺序先发；根包最后发。任一包失败即中止，
      # 避免根包依赖到 npm 上不存在的插件版本。
      - name: 发布 SDK / 插件 / 根包到 npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # 每个包失败时打印可直接定位的包名与 npm 原始错误；失败即中止，
          # 避免根包已经存在、插件却已发出去的半发布状态。
          node scripts/publish-packages.mjs
          npm publish --provenance --json >"${RUNNER_TEMP}/npm-publish-stdout.json" 2>"${RUNNER_TEMP}/npm-publish-stderr.log"
          node scripts/publish-result.mjs \
            --stdout "${RUNNER_TEMP}/npm-publish-stdout.json" \
            --stderr "${RUNNER_TEMP}/npm-publish-stderr.log" \
            --exit-code 0 \
            --name "router-agent" \
            --version "$(node -p "require('./package.json').version")"

      # 回写版本号只是让仓库与 npm 对齐。即使被分支保护拦下，本次发布也已成功；
      # 下一次发布会以 npm 上最新版本为基准继续升 patch，不会重复发布。
      - name: 回写版本号到 main
        if: needs.check.outputs.auto_bump == 'true' && steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ needs.check.outputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          remote_version="$(git show origin/main:package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")"
          if [ "$remote_version" = "$VERSION" ]; then
            echo "::notice::main 上已经是 v${VERSION}，无需回写。"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$VERSION" "$remote_version" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::warning::main 上的版本 ${remote_version} 不低于本次发布的 ${VERSION}（可能有人同时手动发版），跳过回写。"
            exit 0
          fi

          # 以远端 main 为基准重放版本号，避免并发合并导致非快进推送失败。
          # 此时包已发布，本地未提交的版本改动可以安全丢弃。
          git reset --hard --quiet origin/main
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node scripts/publish-packages.mjs --sync
          git add package.json packages/*/package.json
          git commit -m "chore: 发布 v${VERSION} [skip release]" >/dev/null

          if git push origin HEAD:main; then
            echo "::notice::版本号已回写到 main：v${VERSION}"
          else
            echo "::warning::版本号回写 main 失败（通常是 main 分支保护禁止 Actions 直接推送）。npm 已发布 v${VERSION}，下次合并会以 npm 上最新版本为基准继续升版。"
          fi

      - name: 写入发布结果
        if: steps.publish.outputs.published == 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### npm 发布结果"
            echo "- 已发布：https://www.npmjs.com/package/${name}/v/${version}"
            echo "- 判定依据：npm publish 退出码 0，输出为 ${name}@${version}"
            echo "- 发布原因：${{ needs.check.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
